<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Code Canvas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #5d5c71;
      font-family: system-ui, sans-serif;
    }

    main {
      margin: 16px;
    }

    form {
      display: grid;
      gap: 8px;
      max-width: 640px;
      margin-bottom: 16px;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    #status {
      min-height: 1.5em;
      margin: 0 0 8px;
    }

    canvas {
      display: block;
      max-width: 100%;
      width: 1920px;
      height: auto;
      background: #fff;
      image-rendering:pixelated;
    }

    @media (max-width: 640px) {
      main {
        margin: 8px;
      }

      .settings {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="color-form">
      <label for="color-file">Upload a .wpdi file</label>
      <input id="color-file" type="file" accept=".wpdi,text/plain">
      <label for="color-code">Or enter .wpdi file contents here</label>
      <textarea id="color-code" spellcheck="false" placeholder=".wpdi file Contents"></textarea>
      <div class="settings">
        <button type="submit">Display</button>
        <button id="download-wpdi" type="button" disabled>Download .wpdi</button>
        <button id="download-png" type="button" disabled>Download .png</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <canvas id="grid" width="1920" height="1080" aria-label="Color code grid"></canvas>
  </main>
  <script>
    const canvas = document.getElementById("grid");
    const context = canvas.getContext("2d");
    const form = document.getElementById("color-form");
    const colorFileInput = document.getElementById("color-file");
    const colorCodeInput = document.getElementById("color-code");
    const status = document.getElementById("status");
    const downloadButton = document.getElementById("download-wpdi");
    const pngDownloadButton = document.getElementById("download-png");
    let displayedColorCode = "";
    let displayedColumns = 0;
    let downloadFileName = "image.wpdi";
    const palette = {
      "0": "#000000", //black
      "1": "#ffffff", //white
      "2": "#00ffff", //light blue
      "3": "#00ff00", //light green
      "4": "#ffff00", //light yellow
      "5": "#ff0000", //light red
      "6": "#0b5394", //darker blue
      "7": "#34a853", //darker green
      "8": "#fbbc04", //darker yellow
      "9": "#980000", //darker red
      "!": "#8e7cc3", //purple
      " ": "#b7b7b7"  //grey
    };
    const paletteRgba = Object.fromEntries(Object.entries(palette).map(([code, color]) => [
      code,
      [
        Number.parseInt(color.slice(1, 3), 16),
        Number.parseInt(color.slice(3, 5), 16),
        Number.parseInt(color.slice(5, 7), 16),
        255
      ]
    ]));

    function getAspectRatio(width, height) {
      let numerator = width;
      let denominator = height;

      while (denominator !== 0) {
        const remainder = numerator % denominator;
        numerator = denominator;
        denominator = remainder;
      }

      return `${width / numerator}:${height / numerator}`;
    }

    function drawColorCode(colorCode, columns) {
      const rows = Math.ceil(colorCode.length / columns);
      const cellWidth = 12;
      const cellHeight = 6;

      canvas.width = columns * cellWidth;
      canvas.height = rows * cellHeight;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      const pixelCanvas = document.createElement("canvas");
      pixelCanvas.width = columns;
      pixelCanvas.height = rows;
      const pixelContext = pixelCanvas.getContext("2d");
      const imageData = pixelContext.createImageData(columns, rows);
      const pixels = imageData.data;
      for (let index = 0; index < colorCode.length; index++) {
        const pixelIndex = index * 4;
        const color = paletteRgba[colorCode[index]];
        pixels[pixelIndex] = color[0];
        pixels[pixelIndex + 1] = color[1];
        pixels[pixelIndex + 2] = color[2];
        pixels[pixelIndex + 3] = color[3];
      }
      pixelContext.putImageData(imageData, 0, 0);
      context.imageSmoothingEnabled = false;
      context.drawImage(pixelCanvas, 0, 0, canvas.width, canvas.height);

      context.strokeStyle = "#22222220";
      context.lineWidth = 2;
      context.setLineDash([2, 5]);
      context.beginPath();

      for (let column = 0; column <= columns; column++) {
        const x = Math.round(column * cellWidth) + 0.5;
        context.moveTo(x, 0);
        context.lineTo(x, rows * cellHeight);
      }

      for (let row = 0; row <= rows; row++) {
        const y = Math.round(row * cellHeight) + 0.5;
        context.moveTo(0, y);
        context.lineTo(columns * cellWidth, y);
      }

      context.stroke();
      canvas.setAttribute("aria-label", `Grid of ${columns} columns and ${rows} rows`);
      status.textContent = `Aspect ratio:  ${getAspectRatio(columns,rows/2)}.\n
                            Image size: ${columns} x ${rows}.\n
                            Image length: ${colorCode.length} cells.
                            `;
      displayedColorCode = colorCode;
      displayedColumns = columns;
      downloadButton.disabled = false;
      pngDownloadButton.disabled = false;
    }

    const MAX_DECODED_CELLS = 3500000;

    function decodeColorCode(encodedColorCode) {
      const decodedParts = [];
      let decodedLength = 0;

      function append(part) {
        if (decodedLength + part.length > MAX_DECODED_CELLS) {
          throw new Error(`The image is too large to display (maximum ${MAX_DECODED_CELLS.toLocaleString()} cells).`);
        }
        decodedParts.push(part);
        decodedLength += part.length;
      }

      for (let index = 0; index < encodedColorCode.length;) {
        if (encodedColorCode[index] === "[") {
          let digitsEnd = index + 1;
          while (digitsEnd < encodedColorCode.length && /[0-9]/.test(encodedColorCode[digitsEnd])) {
            digitsEnd++;
          }
          const count = Number(encodedColorCode.slice(index + 1, digitsEnd));
          const color = encodedColorCode[digitsEnd + 1];
          if (digitsEnd === index + 1 || encodedColorCode[digitsEnd] !== "*"
              || !Number.isSafeInteger(count) || count < 1 || color === undefined || !(color in palette)
              || encodedColorCode[digitsEnd + 2] !== "]") {
            throw new Error("Invalid run-length color code.");
          }
          if (decodedLength + count > MAX_DECODED_CELLS) {
            throw new Error(`The image is too large to display (maximum ${MAX_DECODED_CELLS.toLocaleString()} cells).`);
          }

          append(color.repeat(count));
          index = digitsEnd + 3;
          continue;
        }

        let digitsEnd = index;
        while (digitsEnd < encodedColorCode.length && /[0-9]/.test(encodedColorCode[digitsEnd])) {
          digitsEnd++;
        }

        if (digitsEnd > index && encodedColorCode[digitsEnd] === "*") {
          const count = Number(encodedColorCode.slice(index, digitsEnd));
          const color = encodedColorCode[digitsEnd + 1];
          if (Number.isSafeInteger(count) && count > 0 && color !== undefined && color in palette
              && decodedLength + count <= MAX_DECODED_CELLS) {
            append(color.repeat(count));
            index = digitsEnd + 2;
            continue;
          }

          let legacyRunStart = index + 1;
          while (legacyRunStart < digitsEnd) {
            const legacyCount = Number(encodedColorCode.slice(legacyRunStart, digitsEnd));
            if (Number.isSafeInteger(legacyCount) && legacyCount > String(legacyCount).length + 2
                && color !== undefined && color in palette
                && decodedLength + legacyRunStart - index + legacyCount <= MAX_DECODED_CELLS) {
              append(encodedColorCode.slice(index, legacyRunStart));
              append(color.repeat(legacyCount));
              index = digitsEnd + 2;
              break;
            }
            legacyRunStart++;
          }
          if (legacyRunStart >= digitsEnd) {
            throw new Error("This unmarked run-length code is ambiguous or too large to display. Regenerate it with the updated image generator.");
          }
          continue;
        }

        const literalEnd = digitsEnd > index ? digitsEnd : index + 1;
        append(encodedColorCode.slice(index, literalEnd));
        index = literalEnd;
      }

      return decodedParts.join("");
    }

    function encodeColorCode(colorCode) {
      let encoded = "";

      for (let start = 0; start < colorCode.length;) {
        let end = start + 1;
        while (end < colorCode.length && colorCode[end] === colorCode[start]) {
          end++;
        }

        const runLength = end - start;
        const encodedRun = `[${runLength}*${colorCode[start]}]`;
        encoded += encodedRun.length < runLength
          ? encodedRun
          : colorCode.slice(start, end);
        start = end;
      }

      return encoded.length < colorCode.length ? encoded : colorCode;
    }

    function displayColorCode(input) {
      const wpdiContents = input.replace(/[\r\n]/g, "");
      const wpdiHeader = wpdiContents.match(/^(\d+)::/);

      if (!wpdiHeader) {
        status.textContent = "The contents of a .wpdi file are formated as [header defining length]::[body defining color].";
        return false;
      }

      const columns = Number(wpdiHeader[1]);
      let colorCode;
      try {
        colorCode = decodeColorCode(wpdiContents.slice(wpdiHeader[0].length));
      } catch (error) {
        status.textContent = error.message;
        return false;
      }

      if (!Number.isSafeInteger(columns) || columns < 1) {
        status.textContent = "The image width must be a positive whole number.";
        return false;
      }

      if (colorCode.length === 0) {
        status.textContent = "Missing body/color information";
        return false;
      }

      const unsupportedCharacter = [...colorCode].find((character) => !(character in palette));
      if (unsupportedCharacter !== undefined) {
        status.textContent = `Unsupported color code character: ${JSON.stringify(unsupportedCharacter)}.`;
        return false;
      }

      drawColorCode(colorCode, columns);
      return true;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      displayColorCode(colorCodeInput.value);
    });

    colorFileInput.addEventListener("change", async () => {
      const file = colorFileInput.files[0];
      if (!file) {
        return;
      }

      try {
        const fileContents = await file.text();
        colorCodeInput.value = fileContents;
        const baseName = file.name.replace(/\.[^.]*$/, "");
        if (displayColorCode(fileContents)) {
          downloadFileName = `${baseName || "image"}.wpdi`;
        }
      } catch (error) {
        status.textContent = `Could not read file: ${error.message}`;
      }
    });

    downloadButton.addEventListener("click", () => {
      const fileContents = `${displayedColumns}::${encodeColorCode(displayedColorCode)}`;
      const download = document.createElement("a");
      const downloadUrl = URL.createObjectURL(new Blob([fileContents], { type: "text/plain" }));
      download.href = downloadUrl;
      download.download = downloadFileName;
      download.click();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
    });

    pngDownloadButton.addEventListener("click", () => {
      canvas.toBlob((blob) => {
        if (!blob) {
          status.textContent = "Could not create a PNG from the current grid.";
          return;
        }

        const download = document.createElement("a");
        const downloadUrl = URL.createObjectURL(blob);
        download.href = downloadUrl;
        download.download = downloadFileName.replace(/\.wpdi$/i, "_wide_pixel.png");
        download.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      }, "image/png");
    });
  </script>
</body>
</html>
