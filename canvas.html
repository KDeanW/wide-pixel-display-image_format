<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Code Canvas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #b7b7b7;
      font-family: system-ui, sans-serif;
    }

    main {
      margin: 16px;
    }

    form {
      display: grid;
      gap: 8px;
      max-width: 640px;
      margin-bottom: 16px;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    #status {
      min-height: 1.5em;
      margin: 0 0 8px;
    }

    canvas {
      display: block;
      max-width: 100%;
      width: 1920px;
      height: auto;
      background: #fff;
      image-rendering: pixelated;
    }

    @media (max-width: 640px) {
      main {
        margin: 8px;
      }

      .settings {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="color-form">
      <label for="color-file">Upload a .wpdi file</label>
      <input id="color-file" type="file" accept=".wpdi,text/plain">
      <label for="color-code">Or enter .wpdi file contents here</label>
      <textarea id="color-code" spellcheck="false" placeholder=".wpdi file Contents"></textarea>
      <div class="settings">
        <button type="submit">Display</button>
        <button id="download-wpdi" type="button" disabled>Download .wpdi</button>
        <button id="download-png" type="button" disabled>Download .png</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <canvas id="grid" width="1920" height="1080" aria-label="Color code grid"></canvas>
  </main>
  <script>
    const canvas = document.getElementById("grid");
    const context = canvas.getContext("2d");
    const form = document.getElementById("color-form");
    const colorFileInput = document.getElementById("color-file");
    const colorCodeInput = document.getElementById("color-code");
    const status = document.getElementById("status");
    const downloadButton = document.getElementById("download-wpdi");
    const pngDownloadButton = document.getElementById("download-png");
    let displayedColorCode = "";
    let displayedColumns = 0;
    let downloadFileName = "image.wpdi";
    const palette = {
      "0": "#000000", //black
      "1": "#ffffff", //white
      "2": "#00ffff", //light blue
      "3": "#00ff00", //light green
      "4": "#ffff00", //light yellow
      "5": "#ff0000", //light red
      "6": "#0b5394", //darker blue
      "7": "#34a853", //darker green
      "8": "#fbbc04", //darker yellow
      "9": "#980000", //darker red
      "!": "#8e7cc3", //purple
      " ": "#b7b7b7"  //grey
    };

    function getAspectRatio(width, height) {
      let numerator = width;
      let denominator = height;

      while (denominator !== 0) {
        const remainder = numerator % denominator;
        numerator = denominator;
        denominator = remainder;
      }

      return `${width / numerator}:${height / numerator}`;
    }

    function drawColorCode(colorCode, columns) {
      const rows = Math.ceil(colorCode.length / columns);
      const cellWidth = 12;
      const cellHeight = 6;

      canvas.width = columns * cellWidth;
      canvas.height = rows * cellHeight;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      for (let index = 0; index < colorCode.length; index++) {
        const column = index % columns;
        const row = Math.floor(index / columns);
        context.fillStyle = palette[colorCode[index]];
        context.fillRect(column * cellWidth, row * cellHeight, cellWidth, cellHeight);
      }

      context.strokeStyle = "#222222";
      context.lineWidth = 2;
      context.setLineDash([2, 5]);
      context.beginPath();

      for (let column = 0; column <= columns; column++) {
        const x = Math.round(column * cellWidth) + 0.5;
        context.moveTo(x, 0);
        context.lineTo(x, rows * cellHeight);
      }

      for (let row = 0; row <= rows; row++) {
        const y = Math.round(row * cellHeight) + 0.5;
        context.moveTo(0, y);
        context.lineTo(columns * cellWidth, y);
      }

      context.stroke();
      canvas.setAttribute("aria-label", `Grid of ${columns} columns and ${rows} rows`);
      status.textContent = `Aspect ratio:  ${getAspectRatio(columns,rows/2)}\n
                            Image size: ${columns} x ${rows}\n
                            Image length: ${colorCode.length} cells
                            `;
      displayedColorCode = colorCode;
      displayedColumns = columns;
      downloadButton.disabled = false;
      pngDownloadButton.disabled = false;
    }

    function displayColorCode(input) {
      let colorCode = input.replace(/[\r\n]/g, "");
      const wpdiHeader = colorCode.match(/^(\d+)::/);

      if (!wpdiHeader) {
        status.textContent = "The contents of a .wpdi file are formated as [header defining length]::[body defining color].";
        return false;
      }

      const columns = Number(wpdiHeader[1]);
      colorCode = colorCode.slice(wpdiHeader[0].length);

      if (colorCode.length === 0) {
        status.textContent = "Missing body/color information";
        return false;
      }

      const unsupportedCharacter = [...colorCode].find((character) => !(character in palette));
      if (unsupportedCharacter !== undefined) {
        status.textContent = `Unsupported color code character: ${JSON.stringify(unsupportedCharacter)}.`;
        return false;
      }

      drawColorCode(colorCode, columns);
      return true;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      displayColorCode(colorCodeInput.value);
    });

    colorFileInput.addEventListener("change", async () => {
      const file = colorFileInput.files[0];
      if (!file) {
        return;
      }

      try {
        const fileContents = await file.text();
        colorCodeInput.value = fileContents;
        const baseName = file.name.replace(/\.[^.]*$/, "");
        if (displayColorCode(fileContents)) {
          downloadFileName = `${baseName || "image"}.wpdi`;
        }
      } catch (error) {
        status.textContent = `Could not read file: ${error.message}`;
      }
    });

    downloadButton.addEventListener("click", () => {
      const fileContents = `${displayedColumns}::${displayedColorCode}`;
      const download = document.createElement("a");
      const downloadUrl = URL.createObjectURL(new Blob([fileContents], { type: "text/plain" }));
      download.href = downloadUrl;
      download.download = downloadFileName;
      download.click();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
    });

    pngDownloadButton.addEventListener("click", () => {
      canvas.toBlob((blob) => {
        if (!blob) {
          status.textContent = "Could not create a PNG from the current grid.";
          return;
        }

        const download = document.createElement("a");
        const downloadUrl = URL.createObjectURL(blob);
        download.href = downloadUrl;
        download.download = downloadFileName.replace(/\.wpdi$/i, ".png");
        download.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      }, "image/png");
    });
  </script>
</body>
</html>
